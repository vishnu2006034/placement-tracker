<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="12"/>
  
  <!-- Outer target ring -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="#334155" stroke-width="16" stroke-dasharray="24 16"/>
  <circle cx="256" cy="240" r="90" fill="none" stroke="url(#primaryGrad)" stroke-width="18"/>
  <circle cx="256" cy="240" r="40" fill="url(#primaryGrad)"/>

  <!-- Target crosshairs -->
  <line x1="256" y1="60" x2="256" y2="110" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="370" x2="256" y2="420" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round"/>
  <line x1="76" y1="240" x2="126" y2="240" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round"/>
  <line x1="386" y1="240" x2="436" y2="240" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Streak fire badge at bottom right -->
  <g transform="translate(320, 310)">
    <circle cx="60" cy="60" r="60" fill="#030712" stroke="#334155" stroke-width="8"/>
    <path d="M60 20 C75 42 90 60 90 78 C90 98 76 110 60 110 C44 110 30 98 30 78 C30 65 42 45 60 20 Z" fill="url(#accentGrad)"/>
    <path d="M60 55 C67 68 74 76 74 86 C74 95 68 102 60 102 C52 102 46 95 46 86 C46 78 52 68 60 55 Z" fill="#fde047"/>
  </g>
</svg>
